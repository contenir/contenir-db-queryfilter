name: "Auto-dev"

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, labeled]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  auto-dev:
    uses: contenir/contenir-qa-tools/.github/workflows/auto-dev.yml@0.1.x
    secrets: inherit
